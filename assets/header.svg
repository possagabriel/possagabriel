<text x="40" y="40">@possagabriel</text>
<text x="1160" y="40" text-anchor="end">web / mobile / jogos</text>
<text x="40" y="415">Python / TypeScript / JavaScript</text>
<text x="1160" y="415" text-anchor="end" fill="#e58b59">↓</text>
</g>
<g font-family="DejaVu Sans,Arial,sans-serif" font-size="112" font-weight="700" letter-spacing="-7">
<text x="32" y="190" fill="#ece9df">gabriel</text>
<text x="32" y="300" fill="#e58b59">possa.</text>
</g>
<text x="40" y="352" fill="#a6a49a" font-family="DejaVu Sans Mono,monospace" font-size="15">apps, jogos e faculdade.</text>
